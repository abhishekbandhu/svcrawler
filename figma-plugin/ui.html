<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --primary: #8e55fc;
            --primary-hover: #7a42ea;
            --bg: #F8FAFC;
            --text: #0F172A;
            --border: #E2E8F0;
            --gold: #F59E0B;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .pro-badge {
            display: none;
            background-color: var(--gold);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        p {
            margin: 0;
            font-size: 13px;
            color: #64748B;
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94A3B8;
            cursor: not-allowed;
        }

        #upgrade-btn {
            background-color: #FEF3C7;
            color: #92400E;
            border: 1px solid #FDE68A;
            display: none;
        }

        #upgrade-btn:hover {
            background-color: #FDE68A;
        }

        #status {
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            margin-top: 8px;
            color: #64748B;
        }

        .error {
            color: #EF4444 !important;
        }

        .success {
            color: #10B981 !important;
        }
    </style>
</head>

    <div class="input-group">
        <input type="url" id="url" placeholder="https://stripe.com" required>
        <button id="extract">Extract SVGs to Canvas</button>
        <button id="upgrade-btn">⭐ Upgrade to Pro (Unlimited SVGs)</button>
    </div>

    <div id="status"></div>

    <script>
        let currentPaymentStatus = 'UNPAID';
        const FREE_LIMIT = 10;

        // Listen for payment status from Figma
        window.onmessage = (event) => {
            const msg = event.data.pluginMessage;
            if (msg.type === 'payment-status') {
                currentPaymentStatus = msg.status;
                if (msg.status === 'PAID') {
                    document.getElementById('pro-badge').style.display = 'block';
                    document.getElementById('upgrade-btn').style.display = 'none';
                    document.getElementById('description-text').textContent = 'Paste a website URL below to extract unlimited SVGs and drop them onto your canvas.';
                } else {
                    document.getElementById('pro-badge').style.display = 'none';
                    document.getElementById('upgrade-btn').style.display = 'block';
                }
            }
        };

        // Handle Checkout click
        document.getElementById('upgrade-btn').onclick = () => {
            parent.postMessage({ pluginMessage: { type: 'initiate-checkout' } }, '*');
        };

        document.getElementById('extract').onclick = async () => {
            const urlInput = document.getElementById('url').value;
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('extract');
            
            if (!urlInput) {
                statusEl.textContent = 'Please enter a URL.';
                statusEl.className = 'error';
                return;
            }

            try {
                // Basic URL validation
                new URL(urlInput);
            } catch {
                statusEl.textContent = 'Please enter a valid URL (include https://).';
                statusEl.className = 'error';
                return;
            }

            btn.disabled = true;
            statusEl.textContent = 'Crawling website for SVGs...';
            statusEl.className = '';

            try {
                const apiUrl = 'https://www.svgcrawler.com/api/crawl';
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                if (!response.ok) {
                    throw new Error(`API returned ${response.status}`);
                }

                const data = await response.json();
                
                if (!data.svgs || data.svgs.length === 0) {
                    statusEl.textContent = 'No SVGs found on this website.';
                    statusEl.className = '';
                    btn.disabled = false;
                    return;
                }

                statusEl.textContent = `Found ${data.svgs.length} graphics. Processing...`;

                // Resolve external SVGs
                const processedSvgs = [];
                for (const svg of data.svgs) {
                    if (svg.type === 'inline' && svg.content) {
                        processedSvgs.push(svg);
                    } else if (svg.type === 'external' && svg.url) {
                        try {
                            const svgRes = await fetch(svg.url);
                            if (svgRes.ok) {
                                const text = await svgRes.text();
                                if (text.includes('<svg')) {
                                    processedSvgs.push({
                                        type: 'inline',
                                        content: text
                                    });
                                }
                            }
                        } catch (e) {
                            console.warn("Could not fetch external SVG:", svg.url);
                        }
                    }
                }

                if (processedSvgs.length === 0) {
                    statusEl.textContent = 'Failed to process any SVGs.';
                    statusEl.className = 'error';
                    btn.disabled = false;
                    return;
                }

                // Handle Paywall Logic in UI
                let svgsToExtract = processedSvgs;
                
                if (currentPaymentStatus === 'UNPAID' && processedSvgs.length > FREE_LIMIT) {
                    const missedCount = processedSvgs.length - FREE_LIMIT;
                    svgsToExtract = processedSvgs.slice(0, FREE_LIMIT);
                    
                    statusEl.innerHTML = `Extracted ${FREE_LIMIT} SVGs to canvas.<br/><span style="color: #D97706; font-weight: bold; margin-top: 4px; display: inline-block;">⚠️ You missed ${missedCount} SVGs! Upgrade to Pro to unlock them.</span>`;
                    statusEl.className = '';
                } else {
                    statusEl.textContent = `Successfully rendered ${processedSvgs.length} SVGs to canvas!`;
                    statusEl.className = 'success';
                }

                // Send to main thread
                parent.postMessage({ pluginMessage: { type: 'extract-svgs', svgs: svgsToExtract } }, '*');
                
                setTimeout(() => {
                    btn.disabled = false;
                }, 1000);

            } catch (err) {
                console.error(err);
                statusEl.textContent = `Error: ${err.message}`;
                statusEl.className = 'error';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
